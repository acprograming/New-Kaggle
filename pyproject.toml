[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-experiments"
version = "0.1.0"
description = "Controlled RSNA knee MRI experiments and complete public inference"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.13,<2", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
train = ["torch==2.11.0", "torchvision==0.26.0", "timm==1.0.29"]
test = ["pytest>=8,<10", "nbformat>=5.10,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
