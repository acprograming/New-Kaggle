name: RSNA numerical and training contracts

on:
  push:
    branches: [main, rsna-original-experiments]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsna-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install official CPU training runtime
        run: python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install experiment and test dependencies
        run: python -m pip install -e '.[test]' timm==1.0.29
      - name: Validate notebooks and embedded Python
        run: python scripts/check_notebooks.py
      - name: Test fusion, data splits, spatial parity, and optimizer updates
        run: python -m pytest -q --junitxml=results/ci-tests.xml
      - name: Record runtime
        if: always()
        run: python scripts/runtime_receipt.py --out results/ci-runtime.json
      - name: Upload numerical validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsna-cpu-contracts
          path: |
            results/ci-tests.xml
            results/ci-runtime.json
          retention-days: 14
